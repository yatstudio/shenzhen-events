const fmtT=t=>new Date(t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false});
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()};
const normMajor=m=>!m?"Other":(m.startsWith("Trade Shows")?"Trade Shows":m);
const majorOf=e=>normMajor(e.categories&&e.categories[0]);
const catName=c=>LANG==="zh"?(CAT_ZH[c]||c):LANG==="tw"?(CAT_TW[c]||CAT_ZH[c]||c):c;
const areaName=a=>LANG==="zh"?(AREA_ZH[a]||a):LANG==="tw"?(AREA_TW[a]||AREA_ZH[a]||a):a;
const S=()=>STRINGS[LANG];
function relDiff(t){return Math.round((new Date(dayKey(t))-new Date(dayKey(Date.now())))/DAY)}
function feeBadge(e){
  const f=(e.fee||"").trim();
  if(!f)return `<span class="fee na">${S().feeNa}</span>`;
  if(f==="Free")return `<span class="fee free">${S().feeFree}</span>`;
  return `<span class="fee paid">${esc(f)}</span>`;
}
function quickPass(e){
  if(F.quick==="all")return true;
  if(!e.start)return false;
  const s=new Date(e.start).getTime(), en=e.end?new Date(e.end).getTime():s+2*3600e3;
  const now=Date.now(), today0=Math.floor((now+SH)/DAY)*DAY-SH;
  if(F.quick==="today")return s<today0+DAY&&en>=today0;
  const dow=new Date(now+SH).getUTCDay();
  const satOff=dow===0?-1:(6-dow);
  const wk0=today0+satOff*DAY;
  return s<wk0+2*DAY&&en>=wk0;
}
function searchText(e){
  return (e.title+" "+(e.title_zh||"")+" "+(e.title_tw||"")+" "+(e.organizer||"")+" "+(e.venue||"")+" "+(e.summary||"")+" "+(e.summary_zh||"")+" "+(e.summary_tw||"")).toLowerCase();
}
function pass(e){
  const q=$("#q").value.trim().toLowerCase();
  if(q&&!searchText(e).includes(q))return false;
  if(F.major&&majorOf(e)!==F.major)return false;
  if(F.subs.size&&!(e.categories&&F.subs.has(e.categories[1])))return false;
  if(F.areas.size&&!F.areas.has(e.area))return false;
  if(F.free&&e.fee!=="Free")return false;
  return quickPass(e);
}
function maps(e){
  if(!e.venue)return"";
  const q=encodeURIComponent(["Shenzhen",e.venue,e.address].filter(Boolean).join(" "));
  return `<a class="btn nav" target="_blank" rel="noopener" href="https://uri.amap.com/search?keyword=${q}">${S().amap}</a>`+
  `<a class="btn nav" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">${S().gmaps}</a>`;
}
function pickTitle(e){
  if(LANG==="zh")return{main:e.title_zh||e.title,sub:e.title_zh&&e.title!==e.title_zh?e.title:""};
  if(LANG==="tw"){const t=e.title_tw||e.title_zh||e.title;return{main:t,sub:t!==e.title?e.title:""}}
  return{main:e.title,sub:e.title_zh&&e.title_zh!==e.title?e.title_zh:""};
}
function pickSummary(e){
  if(LANG==="zh")return e.summary_zh||e.summary||"";
  if(LANG==="tw")return e.summary_tw||e.summary_zh||e.summary||"";
  return e.summary||"";
}
function cardOf(e){
  const tags=e.categories.map(c=>`<span class="tag">${esc(catName(c))}</span>`).join("");
  const occ=e.occurrences_count>1?S().sessions(e.occurrences_count):"";
  const lang=e.languages&&e.languages.length?` · 🗣 ${esc(e.languages.join(" / "))}`:"";
  const tt=pickTitle(e);
  const sum=pickSummary(e);
  return `<div class="ev">
<div class="rail"><div class="t1">${e.start?fmtT(e.start):S().tbc}</div><div class="t2">${e.end?"– "+fmtT(e.end):""}</div></div>
<div class="card"><div class="cinner">
${e.image?`<img class="thumb" src="${esc(e.image)}" alt="" loading="lazy" onerror="this.style.display='none'">`:""}
<div class="cbody">
<div class="trow"><h3><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(tt.main)}</a></h3>${feeBadge(e)}</div>
${tt.sub?`<div class="titlezh">${esc(tt.sub)}</div>`:""}
<div class="loc"><span class="pin">📍</span> <b>${esc(e.venue||S().venueTbc)}</b>${e.area&&e.area!=="Shenzhen"?" · "+esc(areaName(e.area)):""}${e.district?" · "+esc(e.district):""}</div>
<div class="meta">${esc(e.organizer||"")}${occ}${lang}</div>
<div class="tags">${tags}</div>
${sum?`<p class="sum">${esc(sum)}</p>`:""}
<div class="actions">
<a class="btn primary" href="${esc(e.url)}" target="_blank" rel="noopener">${S().details}</a>
${e.calendar_url?`<a class="btn" href="${esc(e.calendar_url)}">${S().cal}</a>`:""}
${maps(e)}
</div>
</div></div></div>
</div>`;
}
function dayMeta(d){
  if(LANG==="en")return `${d.toLocaleDateString("en-GB",{month:"short"})} · ${d.toLocaleDateString("en-GB",{weekday:"long"})}`;
  const wd=(LANG==="tw"?WD_TW:WD_ZH)[d.getDay()];
  return `${d.getMonth()+1}月${d.getDate()}日 · ${wd}`;
}
function render(){
  const t0=new Date();t0.setHours(0,0,0,0);
  const evs=DATA.filter(pass).sort((a,b)=>new Date(a.start||"2100")-new Date(b.start||"2100"));
  const fr=$("#fres");if(fr)fr.textContent=S().results(evs.length);
  $("#fclear").hidden=!(F.major||F.subs.size||F.areas.size||F.quick!=="all"||F.free||$("#q").value.trim());
  if(!evs.length){$("#list").innerHTML=`<div class="empty">${S().empty}</div>`;return}
  let html="",lastKey=null,lastOngoing=null;
  for(const e of evs){
    if(!e.start)continue;
    const ongoing=new Date(e.start)<t0;
    const dk=ongoing?"ongoing":dayKey(e.start);
    if(dk!==lastKey){
      lastKey=dk;
      if(ongoing){
        if(lastOngoing!=="shown"){html+=`<div class="dayhead"><span class="dmeta">${S().onNow}</span><span class="ongoing">${S().ongoing}</span></div>`;lastOngoing="shown"}
      }else{
        const d=new Date(e.start),diff=relDiff(e.start),rel=diff>=0&&diff<=2?S().rel[diff]:"";
        html+=`<div class="dayhead"><span class="dnum">${d.getDate()}</span><span class="dmeta">${dayMeta(d)}</span>${rel?`<span class="drel ${diff===0?"":"future"}">${rel}</span>`:""}</div>`;
      }
    }
    html+=cardOf(e);
  }
  $("#list").innerHTML=html;
}
function renderTabs(){
  const majors=["Meetups","Shows & Nightlife","Around Town","Trade Shows"];
  const counts={};
  DATA.forEach(e=>{const m=majorOf(e);counts[m]=(counts[m]||0)+1});
  const extra=Object.keys(counts).filter(m=>!majors.includes(m)).sort();
  const allMajors=majors.filter(m=>counts[m]).concat(extra);
  $("#g-tabs").innerHTML=`<button class="tab${F.major?"":" on"}" data-v="__all">${S().allTab}<span class="n">${DATA.length}</span></button>`+
    allMajors.map(m=>`<button class="tab${F.major===m?" on":""}" data-v="${esc(m)}">${esc(catName(m))}<span class="n">${counts[m]}</span></button>`).join("");
}
function renderAreas(){
  const areas=[...new Set(DATA.map(e=>e.area))].filter(a=>a&&a!=="Shenzhen");
  const order=["Futian","Nanshan","Shekou","OCT","Luohu","Bao'an","Longgang","Longhua"];
  areas.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  $("#g-areas").innerHTML=areas.map(a=>`<button class="chip${F.areas.has(a)?" on":""}" data-v="${esc(a)}">${esc(areaName(a))}</button>`).join("");
}
function renderSubs(){
  const row=$("#row-subs"), box=$("#g-subs");
  if(!F.major){row.hidden=true;box.innerHTML="";return}
  const counts={};
  DATA.filter(e=>majorOf(e)===F.major).forEach(e=>{const s=e.categories&&e.categories[1];if(s)counts[s]=(counts[s]||0)+1});
  const subs=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  if(!subs.length){row.hidden=true;box.innerHTML="";return}
  row.hidden=false;
  box.innerHTML=subs.map(s=>`<button class="chip subchip${F.subs.has(s)?" on":""}" data-v="${esc(s)}" title="${esc(s)}">${esc(catName(s))} <span class="n">${counts[s]}</span></button>`).join("");
}
function renderStats(){
  if(!DATA.length)return;
  const free=DATA.filter(e=>e.fee==="Free").length;
  const upd=UPD?new Date(UPD).toLocaleString(LANG==="zh"?"zh-CN":LANG==="tw"?"zh-TW":"en-GB",{month:LANG==="en"?"short":"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}):"–";
  $("#st-line").innerHTML=S().stats(DATA.length,free,esc(upd));
}
window.routePost=function(w){var gh=document.getElementById("route-gh"),ml=document.getElementById("route-mail"),fm=document.getElementById("route-form"),y=document.getElementById("epost-yes"),m=document.getElementById("epost-mail"),n=document.getElementById("epost-no");if(!gh||!fm)return;gh.hidden=w!=="gh";if(ml)ml.hidden=w!=="mail";fm.hidden=w!=="form";if(y)y.classList.toggle("on",w==="gh");if(m)m.classList.toggle("on",w==="mail");if(n)n.classList.toggle("on",w==="form")};
window.copyRouteMail=function(b){if(navigator.clipboard)navigator.clipboard.writeText("event.submit@yatslist.com").then(()=>{const t=b.textContent;b.textContent=tr("copied");setTimeout(()=>b.textContent=t,1500)})};
window.copyPostPrompt=function(b){if(navigator.clipboard)navigator.clipboard.writeText(document.getElementById("prompt-post-card").innerText).then(()=>{const t=b.textContent;b.textContent=tr("copied");setTimeout(()=>b.textContent=t,1500)})};
window.hlSubmit=()=>{setTimeout(()=>{const el=document.getElementById("event-post");if(!el)return;el.classList.add("hl");setTimeout(()=>el.classList.remove("hl"),1800)},400)};
function applyLang(){
  const t=S();
  document.documentElement.lang=LANG==="en"?"en":(LANG==="tw"?"zh-TW":"zh-CN");
  document.title=t.docTitle;
  document.querySelectorAll(".langsw button").forEach(b=>{const on=b.dataset.setlang===LANG;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on?"true":"false")});
  _st("#nav-home",t.navHome);_st("#nav-hack",t.navHack);_st("#nav-expat",t.navExpat);
  _st("#page-title",t.pageTitle);_st("#cmd-label",t.cmdLabel);_st("#cmd-copy",t.cmdCopy);
  _sh("#tagline",t.tagline);
  _sh("#agentbar-p",t.agentbar);
  document.querySelectorAll(".copybtn").forEach(b=>b.textContent=t.copy);
  $("#q").placeholder=t.searchPh;
  document.querySelectorAll("#g-quick button").forEach(b=>b.textContent=t.quick[b.dataset.v]);
  $("#g-free").textContent=t.freeOnly;
  $("#label-type").textContent=t.labelType;
  $("#label-area").textContent=t.labelArea;
  $("#fclear").textContent=t.clear;
  $("#sub-h").textContent=t.subH;
  $("#sub-intro").textContent=t.subIntro;
  $("#subprompt").textContent=LANG==="zh"?PROMPT_ZH:LANG==="tw"?PROMPT_TW:PROMPT_EN;
  _st("#ta-submit",t.navSubmit);
  _st("#epost-title",t.postTitle);_st("#epost-q",t.routeQ);
  _st("#epost-yes",t.routeYes);_st("#epost-mail",t.routeMail);_st("#epost-no",t.routeNo);
  _st("#epost-copy",t.postCopy);
  $("#prompt-post-card").textContent=LANG==="zh"?POST_PROMPT_ZH:LANG==="tw"?POST_PROMPT_TW:POST_PROMPT_EN;
  _st("#epost-mail-note",t.routeMailNote);_st("#epost-mail-copy",t.routeMailCopy);_st("#epost-mail-send",t.routeMailSend);
  document.getElementById("epost-mail-send").href=t.routeMailHref;
  _st("#epost-form-btn",t.routeFormBtn);_st("#epost-form-note",t.routeFormNote);
  _st("#sf-tag",t.footTag);_st("#sf-home",t.navHome);_st("#sf-hack",t.navHack);_st("#sf-expat",t.navExpat);_st("#sf-sub",t.footSub);
  _st("#sf-small",t.footSmall);_sh("#sf-feeds",t.footFeeds);_sh("#sf-src",t.footSrc);_sh("#sf-contact",t.footContact);
  syncThemeUI();
  renderTabs();renderAreas();renderSubs();renderStats();render();measureBar();
}
function setLang(l){LANG=(l==="en"||l==="tw")?l:"zh";try{localStorage.setItem("szLang",LANG)}catch(e){}applyLang()}
document.querySelectorAll("[data-setlang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.setlang)));
window.copyPrompt=b=>{if(navigator.clipboard)navigator.clipboard.writeText(document.getElementById("subprompt").innerText).then(()=>{const t=b.textContent;b.textContent=S().copied;setTimeout(()=>b.textContent=S().copy,1500)})};
document.getElementById("cmd-copy").addEventListener("click",function(){if(navigator.clipboard)navigator.clipboard.writeText("https://yatslist.com/expat/events.json").then(()=>{this.textContent=S().cmdCopied;setTimeout(()=>this.textContent=S().cmdCopy,1200)})});
function measureBar(){
  const tb=document.querySelector(".topbar");if(tb)document.documentElement.style.setProperty("--tbh",tb.offsetHeight+"px");
  const b=document.querySelector(".bar");if(b)document.documentElement.style.setProperty("--barh",b.offsetHeight+"px");
}
window.addEventListener("resize",measureBar);
$("#g-tabs").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-v]");if(!b)return;
  F.major=b.dataset.v==="__all"?null:b.dataset.v;
  F.subs.clear();
  renderTabs();renderSubs();render();measureBar();
});
$("#g-subs").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-v]");if(!b)return;
  const v=b.dataset.v;
  if(F.subs.has(v))F.subs.delete(v);else F.subs.add(v);
  b.classList.toggle("on",F.subs.has(v));
  render();measureBar();
});
$("#g-areas").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-v]");if(!b)return;
  const v=b.dataset.v;
  if(F.areas.has(v))F.areas.delete(v);else F.areas.add(v);
  b.classList.toggle("on",F.areas.has(v));
  render();measureBar();
});
$("#g-quick").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-v]");if(!b)return;
  F.quick=b.dataset.v;
  document.querySelectorAll("#g-quick button").forEach(x=>x.classList.toggle("on",x===b));
  render();measureBar();
});
$("#g-free").addEventListener("click",()=>{
  F.free=!F.free;
  $("#g-free").classList.toggle("on",F.free);
  render();measureBar();
});
$("#fclear").addEventListener("click",()=>{
  F={major:null,subs:new Set(),areas:new Set(),quick:"all",free:false};$("#q").value="";
  document.querySelectorAll("#g-quick button").forEach((x,i)=>x.classList.toggle("on",i===0));
  $("#g-free").classList.remove("on");
  renderTabs();renderAreas();renderSubs();render();measureBar();
});
$("#q").addEventListener("input",()=>{render();measureBar()});
/* ===== theme: auto (follow system) / light / dark — preference stored in localStorage "szTheme" (shared with Yat's List) ===== */
let THEME="auto";try{THEME=localStorage.getItem("szTheme")||"auto"}catch(e){}
if(THEME!=="light"&&THEME!=="dark")THEME="auto";
const _mqDark=window.matchMedia("(prefers-color-scheme: dark)");
function resolvedTheme(){return THEME==="dark"?"dark":THEME==="light"?"light":(_mqDark.matches?"dark":"light")}
function syncThemeUI(){document.querySelectorAll(".themesw button").forEach(b=>{const on=b.dataset.settheme===THEME;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on?"true":"false");if(b.dataset.settheme==="auto")b.textContent=tr("themeAuto");if(b.dataset.settheme==="light"){b.setAttribute("aria-label",tr("themeLight"));b.title=tr("themeLight")}if(b.dataset.settheme==="dark"){b.setAttribute("aria-label",tr("themeDark"));b.title=tr("themeDark")}});const g=document.querySelector(".themesw");if(g)g.setAttribute("aria-label",tr("themeLabel"))}
function applyTheme(){const r=resolvedTheme();document.documentElement.setAttribute("data-theme",r);document.documentElement.setAttribute("data-theme-mode",THEME);const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.setAttribute("content",r==="light"?"#f6f8f7":"#0d1218");syncThemeUI()}
function setTheme(t){THEME=(t==="light"||t==="dark")?t:"auto";try{localStorage.setItem("szTheme",THEME)}catch(e){}applyTheme()}
document.querySelectorAll("[data-settheme]").forEach(b=>b.addEventListener("click",()=>setTheme(b.dataset.settheme)));
if(_mqDark.addEventListener)_mqDark.addEventListener("change",()=>{if(THEME==="auto")applyTheme()});
applyTheme();
$("#list").innerHTML=`<div class="empty">${S().loading}</div>`;
applyLang();
fetch("events.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{
  DATA=j.events||[];
  UPD=j.updated_at||null;
  applyLang();setTimeout(measureBar,400);
}).catch(()=>{$("#list").innerHTML=`<div class="empty">${S().loadFail}</div>`});
</script>
