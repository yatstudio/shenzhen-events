<style>
:root{--bg:#0a0d12;--s2:#0f131c;--s3:#161c29;--ink:#e7ecf5;--ink-sec:#a5b4d3;--ink-ter:#7c8db0;--accent:#5aa2ff;--gold:#ffd60a;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16.5px;line-height:1.65}
.wrap{max-width:860px;margin:0 auto;padding:0 clamp(16px,4vw,24px)}
a{color:var(--accent)}
header.top{padding:34px 0 8px}
.back{font-size:.9rem;color:var(--ink-sec);text-decoration:none}
.back:hover{color:var(--ink)}
h1{font-size:1.9rem;font-weight:850;letter-spacing:.01em;margin:10px 0 4px}
.sub{color:var(--ink-sec);font-size:1rem}
.stats{display:flex;gap:22px;margin:18px 0 4px;flex-wrap:wrap}
.stat b{display:block;font-size:1.45rem;font-weight:850;color:#fff;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--ink-ter)}
.bar{position:sticky;top:0;z-index:20;background:rgba(10,13,18,.92);backdrop-filter:blur(16px) saturate(180%);padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08);margin-top:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--s3);border:1px solid rgba(255,255,255,.13);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-size:.92rem;font-weight:650;cursor:pointer}
.chip.on{background:#ffd60a;border-color:#ffd60a;color:#0a0c10;font-weight:800}
.bar input{width:100%;margin-top:10px;background:var(--s3);border:1px solid rgba(255,255,255,.13);border-radius:12px;color:var(--ink);font:inherit;padding:12px 14px}
.sect{margin:26px 0 10px;font-size:1.12rem;font-weight:800}
.sect small{color:var(--ink-ter);font-weight:600;font-size:.85rem;margin-left:8px}
.card{background:var(--s2);border:1px solid rgba(255,255,255,.09);border-radius:var(--r);padding:16px 18px;margin:0 0 12px}
.card h3{font-size:1.06rem;line-height:1.5;font-weight:750}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--accent)}
.rb{display:inline-block;font-size:.72rem;font-weight:800;border-radius:999px;padding:2px 9px;vertical-align:2px;margin-right:7px;white-space:nowrap}
.rb.cn{background:#1d3a6e;color:#bcd6ff}.rb.hk{background:#6e1d1d;color:#ffc9c9}.rb.tw{background:#0f4d44;color:#a9ecdf}.rb.mo{background:#4d3a0f;color:#ffe9a9}.rb.on{background:#3a2a5e;color:#dcc9ff}
.meta{color:var(--ink-sec);font-size:.9rem;margin-top:5px}
.dl{display:inline-block;font-weight:800;font-size:.85rem;border-radius:8px;padding:1px 8px;background:rgba(255,255,255,.07);color:var(--ink)}
.dl.soon{background:#7a1f1f;color:#ffd7d7}
.dl.mid{background:#6e5510;color:#ffe9a9}
.prize{color:#ffd60a;font-size:.9rem;margin-top:5px}
.tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.74rem;background:rgba(255,255,255,.07);border-radius:6px;padding:2px 8px;color:var(--ink-sec)}
.sum{color:var(--ink-sec);font-size:.92rem;margin-top:8px}
.actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-block;background:var(--s3);border:1px solid rgba(255,255,255,.15);color:var(--ink);border-radius:11px;padding:9px 16px;font-size:.92rem;font-weight:700;text-decoration:none;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,#2dd4bf,#5aa2ff);border:none;color:#06121a}
.empty{color:var(--ink-ter);text-align:center;padding:36px 0}
.foot{font-size:.84rem;color:var(--ink-ter);padding:30px 0 56px;line-height:1.9}
.foot a{color:#8db8ff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<a class="back" href="./">← 返回活动日报</a>
<h1>🛠 黑客松专题</h1>
<p class="sub">正在报名的黑客松与创新大赛 · 大陆 / 香港 / 澳门 / 台湾线下为主，线上不限区域 · 每日更新</p>
<div class="stats">
<div class="stat"><b id="st-total">–</b><span>报名中</span></div>
<div class="stat"><b id="st-soon">–</b><span>72 小时内截止</span></div>
<div class="stat"><b id="st-cn">–</b><span>大陆 + 港澳台线下</span></div>
<div class="stat"><b id="st-upd">–</b><span>数据更新</span></div>
</div>
</header>
<div class="bar">
<div class="chips" id="regions">
<button class="chip on" data-r="all">全部</button>
<button class="chip" data-r="大陆">大陆</button>
<button class="chip" data-r="香港">香港</button>
<button class="chip" data-r="澳门">澳门</button>
<button class="chip" data-r="台湾">台湾</button>
<button class="chip" data-r="线上">线上</button>
</div>
<input id="q" type="search" placeholder="搜比赛名、城市、主题（如：AI Agent / 机器人 / 深圳）">
</div>
<main id="list"><div class="empty">加载中…</div></main>
<div class="foot">
数据来源：<a href="https://hack123.henryht.sh" target="_blank" rel="noopener">黑123</a>（经其 MCP 接口核实）· 报名与赛程以官方页面为准。<br>
🤖 本站由 Yat 的 Agent 自动维护（每日更新）· 有建议或问题，欢迎联系 Yat：<a href="https://x.com/yatbtc" target="_blank" rel="noopener">X @yatbtc</a><br>
← <a href="./">回到活动日报：深圳 + 香港 AI / 创业 / 科技活动</a>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
const DAY=864e5;
let DATA=[], region="all";
const RB={"大陆":"cn","香港":"hk","台湾":"tw","澳门":"mo","线上":"on"};
function dlBadge(h){
  if(!h.deadline) return "";
  const d=Math.ceil((new Date(h.deadline+"T23:59:59+08:00")-Date.now())/DAY);
  if(d<0) return "";
  if(d<=3) return `<span class="dl soon">报名剩 ${d} 天</span>`;
  if(d<=7) return `<span class="dl mid">报名剩 ${d} 天</span>`;
  return `<span class="dl">截止 ${h.deadline.slice(5)}</span>`;
}
function cardOf(h){
  const dates=[h.start?`比赛 ${h.start}`:"比赛时间见官方页", h.end&&h.end!==h.start?`~ ${h.end}`:""].join(" ");
  return `<div class="card">
<h3><span class="rb ${RB[h.region]||'on'}">${h.region}${h.region!=="线上"?" · "+h.city:""}</span><a href="${h.url}" target="_blank" rel="noopener">${h.title}</a></h3>
<div class="meta">🗓 ${dates} · ${h.format} ${h.deadline?`· ${dlBadge(h)}`:""}</div>
${h.prize?`<div class="prize">💰 ${h.prize}</div>`:""}
${h.summary?`<p class="sum">${h.summary}</p>`:""}
<div class="tags">${(h.topics||[]).map(t=>`<span class="tag">${t}</span>`).join("")}</div>
<div class="actions"><a class="btn primary" href="${h.url}" target="_blank" rel="noopener">官方页 / 报名 →</a><a class="btn" href="${h.detail_url}" target="_blank" rel="noopener">黑123 详情</a></div>
</div>`;
}
function render(){
  const q=$("#q").value.trim();
  const now=Date.now();
  let evs=DATA.filter(h=>!h.deadline||new Date(h.deadline+"T23:59:59+08:00")>=new Date(now-DAY));
  evs=evs.filter(h=>(region==="all"||h.region===region)&&(!q||(h.title+(h.city||"")+(h.topics||[]).join("")).includes(q)));
  evs.sort((a,b)=>(a.deadline||"9999")<(b.deadline||"9999")?-1:1);
  $("#st-total").textContent=DATA.length;
  $("#st-soon").textContent=DATA.filter(h=>h.deadline&&Math.ceil((new Date(h.deadline+"T23:59:59+08:00")-now)/DAY)<=3&&Math.ceil((new Date(h.deadline+"T23:59:59+08:00")-now)/DAY)>=0).length;
  $("#st-cn").textContent=DATA.filter(h=>["大陆","香港","澳门","台湾"].includes(h.region)).length;
  if(!evs.length){$("#list").innerHTML='<div class="empty">没有符合条件的比赛</div>';return}
  const soon=evs.filter(h=>h.deadline&&Math.ceil((new Date(h.deadline+"T23:59:59+08:00")-now)/DAY)<=3);
  const week=evs.filter(h=>h.deadline&&Math.ceil((new Date(h.deadline+"T23:59:59+08:00")-now)/DAY)>3&&Math.ceil((new Date(h.deadline+"T23:59:59+08:00")-now)/DAY)<=7);
  const rest=evs.filter(h=>!h.deadline||Math.ceil((new Date(h.deadline+"T23:59:59+08:00")-now)/DAY)>7);
  let html="";
  if(soon.length)html+=`<div class="sect">🔥 72 小时内截止<small>先抢这些</small></div>`+soon.map(cardOf).join("");
  if(week.length)html+=`<div class="sect">📅 本周内截止</div>`+week.map(cardOf).join("");
  if(rest.length)html+=`<div class="sect">🛠 报名中<small>按截止日期排序</small></div>`+rest.map(cardOf).join("");
  $("#list").innerHTML=html;
}
$("#regions").addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(!b)return;region=b.dataset.r;document.querySelectorAll("#regions .chip").forEach(x=>x.classList.toggle("on",x===b));render()});
$("#q").addEventListener("input",render);
fetch("hackathons.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{DATA=d.hackathons||[];$("#st-upd").textContent=(d.updated_at||"").slice(5,10);render()}).catch(()=>{$("#list").innerHTML='<div class="empty">数据加载失败，请稍后刷新</div>'});
</script>
</body>
</html>
