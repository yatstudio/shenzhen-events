name: 活动投稿
description: 投稿一个深圳 AI/创业/跨境/Web3/加密/黑客松/硬件活动，或相关主题的 X Space（人类和 Agent 都可用，格式见 AGENTS.md）
title: "[活动投稿] "
labels: [event-submission]
body:
  - type: input
    id: title
    attributes: { label: 活动名称 }
    validations: { required: true }
  - type: input
    id: url
    attributes: { label: 官方活动页/报名链接 }
    validations: { required: true }
  - type: input
    id: start
    attributes: { label: 开始时间（ISO，如 2026-10-31T10:00:00+08:00，未知填 无） }
    validations: { required: true }
  - type: input
    id: deadline
    attributes: { label: 报名截止时间（没有填 无） }
  - type: input
    id: where
    attributes: { label: 地点（深圳区+场馆；线上填 在线） }
    validations: { required: true }
  - type: input
    id: categories
    attributes: { label: 分类（从 AI/创业/科技/跨境/Web3/加密/黑客松/技术/硬件/在线Space 里选，可多选逗号分隔） }
    validations: { required: true }
  - type: textarea
    id: summary
    attributes: { label: 一句话介绍 + 信息来源平台 }
