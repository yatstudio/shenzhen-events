<script src="/city.js?v=1"></script>
<script>
(function(){
var done=false,go=function(c){if(done)return;done=true;var p=(window.YLCity&&YLCity.pages[c])||"/szevents/";location.replace(p+location.search+location.hash)};
if(!window.YLCity){go("sz");return}
var t=setTimeout(function(){go("sz")},1500);/* belt and braces: city.js resolves within ~800ms */

})();
</script>
